<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F8FAFC" />
  <meta name="description" content="CRM Mitra — Pengelolaan Pelanggan, Sales, dan Stok" />
  <title>CRM Mitra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>
    // Instant smart router: redirect based on auth status
    (function() {
      try {
        var user = localStorage.getItem('crm_user');
        if (user) {
          window.location.replace('dashboard.html');
        } else {
          window.location.replace('login.html');
        }
      } catch (e) {
        window.location.replace('login.html');
      }
    })();
  </script>
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100dvh;background:var(--bg);padding:20px;">
  <div style="max-width:420px;width:100%;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px 24px;box-shadow:0 8px 30px rgba(0,0,0,.06);">
    <div style="display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;background:var(--surface-2);border-radius:14px;margin-bottom:16px;">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="8" fill="#3B82F6"/><path d="M7 14C7 10.134 10.134 7 14 7V7C17.866 7 21 10.134 21 14V14C21 17.866 17.866 21 14 21V21" stroke="white" stroke-width="2.5" stroke-linecap="round"/><circle cx="14" cy="14" r="3" fill="white"/></svg>
    </div>
    <h1 style="font-size:20px;font-weight:700;color:var(--text);margin-bottom:6px;">CRM Mitra</h1>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:20px;">Memuat halaman aplikasi…</p>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <a href="dashboard.html" class="btn-primary" style="justify-content:center;">Buka Dashboard</a>
      <a href="login.html" class="btn-secondary" style="justify-content:center;">Halaman Masuk (Login)</a>
    </div>
  </div>
</body>
</html>
