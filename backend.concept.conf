# ═══════════════════════════════════════════════════════
#  6. API ROUTES (REST — prefix: /api/v1)
# ═══════════════════════════════════════════════════════

# AUTH
# POST   /auth/login                 — login, set session cookie
# POST   /auth/logout                — destroy session
# GET    /auth/me                    — current user info

# CUSTOMERS  [requireAuth]
# GET    /customers                  — list (search, filter category, filter sales, paginate)
# POST   /customers                  — create
# GET    /customers/:id              — detail + recent activities
# PATCH  /customers/:id              — update
# DELETE /customers/:id              — soft-delete [requireRole: ADMIN]

# SALES ACTIVITIES  [requireAuth]
# GET    /sales/activities           — list (filter: date, type, status, sales, customer)
# POST   /sales/activities           — create (+ upload photo)
# GET    /sales/activities/:id       — detail
# PATCH  /sales/activities/:id       — update / mark done
# DELETE /sales/activities/:id       — cancel [requireRole: ADMIN|MANAGER]

# STOCK  [requireAuth]
# GET    /stock/products             — list products + current qty + level flag
# POST   /stock/products             — add product [requireRole: ADMIN|MANAGER]
# GET    /stock/products/:id         — detail + mutation history
# PATCH  /stock/products/:id         — update product info
# POST   /stock/mutations            — record IN / OUT / ADJUSTMENT
# GET    /stock/mutations            — mutation log (filter: product, type, date)
# GET    /stock/alerts               — products where stockQty <= minStock

# DASHBOARD  [requireAuth]
# GET    /dashboard/summary          — aggregate: total customers, activities today,
#                                      stock alerts count, pipeline counts

# UPLOADS  [requireAuth]
# POST   /uploads/photo              — upload to GCS, return URL
#                                      max 5MB, mime: image/jpeg|png|webp


# ═══════════════════════════════════════════════════════
#  7. SESSION & COOKIE CONFIGURATION
# ═══════════════════════════════════════════════════════

# Library: @fastify/session + connect-redis (RedisStore)
#
# Session object shape:
#   req.session.userId   : string (UUID)
#   req.session.role     : Role
#   req.session.name     : string
#
# Cookie settings:
#   name     : crm_sid
#   httpOnly : true       — JS cannot access
#   secure   : true       — HTTPS only
#   sameSite : strict     — CSRF protection
#   maxAge   : 86400      — 24 hours (seconds)
#   path     : /
#
# Redis key pattern: sess:{sessionId}
# Redis TTL: 24h (auto-expire)


