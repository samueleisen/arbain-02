# ═══════════════════════════════════════════════════════
#  3. ENVIRONMENT VARIABLES (.env template)
# ═══════════════════════════════════════════════════════

# -- Server --
NODE_ENV=production
PORT=3000
HOST=0.0.0.0
APP_URL=https://crm.mitra.co.id

# -- Database (Cloud SQL private IP) --
DATABASE_URL=postgresql://USER:PASSWORD@PRIVATE_IP:5432/crm_mitra?schema=public&sslmode=require
DB_POOL_MIN=2
DB_POOL_MAX=10

# -- Session --
SESSION_SECRET=REPLACE_WITH_64_CHAR_RANDOM_STRING
SESSION_MAX_AGE_MS=86400000          # 24 jam
SESSION_REDIS_URL=redis://PRIVATE_IP:6379

# -- Cookie --
COOKIE_SECURE=true
COOKIE_SAME_SITE=strict
COOKIE_HTTP_ONLY=true
COOKIE_DOMAIN=crm.mitra.co.id

# -- Google Cloud Storage --
GCS_BUCKET=crm-mitra-uploads
GCS_PROJECT_ID=crm-mitra-prod
GOOGLE_APPLICATION_CREDENTIALS=/etc/gcp/service-account.json

# -- Rate Limiting --
RATE_LIMIT_MAX=100                   # req per window
RATE_LIMIT_WINDOW_MS=60000           # 1 menit

# -- Logging --
LOG_LEVEL=info                       # debug | info | warn | error
LOG_FORMAT=json                      # json di prod, pretty di dev


