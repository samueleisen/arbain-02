# ═══════════════════════════════════════════════════════
#  1. CONFIRMED STACK DECISIONS
# ═══════════════════════════════════════════════════════

RUNTIME          = Node.js v20 LTS (TypeScript strict mode)
ARCHITECTURE     = Monolith Modular (single deployable unit, domain-separated modules)
FRAMEWORK        = Fastify v4                  # high-throughput, schema-first
ORM              = Prisma v5                   # type-safe DB client + migrations
DATABASE         = PostgreSQL 15 (Cloud SQL)   # managed, GCP
SESSION_STORE    = Redis 7 (Memorystore, GCP)  # server-side session persistence
AUTH_STRATEGY    = Session + Cookie            # httpOnly, sameSite=strict, secure
FILE_STORAGE     = Google Cloud Storage        # foto bukti kunjungan (presigned URL)
HOSTING          = GCP Compute Engine          # VPS — e2-small (2 vCPU, 2 GB RAM) start
REVERSE_PROXY    = Nginx                       # SSL termination, static assets
SSL              = Let's Encrypt (Certbot)     # auto-renew via cronjob
TENANT_MODEL     = Single-tenant               # satu mitra, satu database
PWA              = Yes                         # service worker + manifest (frontend concern)


