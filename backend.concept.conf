# ═══════════════════════════════════════════════════════
#  10. DEPLOYMENT CHECKLIST (when ready to implement)
# ═══════════════════════════════════════════════════════

# PHASE 1 — GCP Setup
#   [ ] Create GCP project: crm-mitra-prod
#   [ ] Enable APIs: Compute Engine, Cloud SQL Admin, Memorystore, Cloud Storage
#   [ ] Create VPC with private subnet (asia-southeast2)
#   [ ] Provision e2-small VM (Ubuntu 22.04)
#   [ ] Provision Cloud SQL PostgreSQL 15 (private IP, db-g1-small)
#   [ ] Provision Memorystore Redis 7 (1 GB)
#   [ ] Create GCS bucket: crm-mitra-uploads (private, signed URL access)
#   [ ] Configure firewall: allow 80, 443 inbound; deny rest; SSH via IAP
#   [ ] Create service account for GCS with Storage Object Creator role

# PHASE 2 — VM Bootstrap
#   [ ] Install Node.js 20 LTS (via NodeSource)
#   [ ] Install PM2 globally (npm i -g pm2)
#   [ ] Install Nginx
#   [ ] Install Certbot + certbot-nginx plugin
#   [ ] Clone repo, npm ci --production
#   [ ] Copy .env (secrets via GCP Secret Manager or manual)
#   [ ] Run: npx prisma migrate deploy
#   [ ] Run: npx prisma db seed (initial admin user)
#   [ ] PM2 start + pm2 save + pm2 startup

# PHASE 3 — SSL & DNS
#   [ ] Point domain A record → VM external IP
#   [ ] Run: certbot --nginx -d crm.mitra.co.id
#   [ ] Verify auto-renew: certbot renew --dry-run

# PHASE 4 — Monitoring (minimal)
#   [ ] GCP Cloud Monitoring alerts: CPU > 80%, memory > 85%
#   [ ] /health endpoint returning 200 (Nginx upstream_check)
#   [ ] PM2 log rotation configured
#   [ ] Daily Cloud SQL automated backup enabled (retention: 7 days)


